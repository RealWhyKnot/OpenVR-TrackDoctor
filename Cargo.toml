[package]
name = "trackdoctor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Finds out why a SteamVR lighthouse device drifted. Watches poses, the vrserver log, and the USB bus, then names the cause with evidence."

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
futures-core = "0.3.34"
nusb = "0.2.7"
openvr = "0.9.0"
openvr_sys = "2.1.4"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
