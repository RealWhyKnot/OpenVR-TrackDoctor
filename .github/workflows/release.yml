name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          prerelease-suffix: 'beta'

      - name: Workflow syntax
        uses: RealWhyKnot/workflows/workflow-syntax@v1

      - name: Test
        shell: pwsh
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }

      - name: Install NSIS
        shell: pwsh
        run: |
          $want = 'v3.12'
          $have = ''
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (Test-Path -LiteralPath $exe) { $have = (& $exe /VERSION) }
          if ($have -ne $want) {
            choco install nsis --version 3.12.0 --force -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $global:LASTEXITCODE = 0
          & ./installer/build.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed ($LASTEXITCODE)" }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($kind in @('setup', 'zip')) {
            if ($kind -eq 'setup') { $name = "OpenVR-TrackDoctor-Setup-$version.exe" } else { $name = "OpenVR-TrackDoctor-$version.zip" }
            $path = "target/installer/$name"
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText("$path.sha256", "$hash  $name`n", $utf8)
            $size = [math]::Round((Get-Item -LiteralPath $path).Length / 1MB, 2)
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "$kind=$path"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "${kind}name=$name"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "${kind}size=$size"
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "${kind}sha256=$hash"
          }

      - name: Installer smoke test
        shell: pwsh
        run: |
          ./.github/scripts/Test-Installer.ps1 -Setup '${{ steps.package.outputs.setup }}' -Version '${{ steps.tag.outputs.version }}'

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          title: TrackDoctor ${{ steps.tag.outputs.tag }}
          extra: |
            ### Download

            - `${{ steps.package.outputs.setupname }}` (${{ steps.package.outputs.setupsize }} MiB) - installer; TrackDoctor then starts with SteamVR on its own
            - SHA256 `${{ steps.package.outputs.setupsha256 }}`
            - `${{ steps.package.outputs.zipname }}` (${{ steps.package.outputs.zipsize }} MiB) - portable zip; run `trackdoctor autostart on` from it to start with SteamVR
            - SHA256 `${{ steps.package.outputs.zipsha256 }}`

      - name: Publish release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          target: ${{ steps.tag.outputs.sha }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          draft-first: 'true'
          verify-asset: ${{ steps.package.outputs.setupname }}
          verify-sha256: ${{ steps.package.outputs.setupsha256 }}
          assets: |
            ${{ steps.package.outputs.setup }}
            ${{ steps.package.outputs.setup }}.sha256
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Remove partial release on failure
        if: failure()
        shell: pwsh
        run: |
          gh release delete $env:RELEASE_TAG --repo '${{ github.repository }}' --yes 2>$null
          $global:LASTEXITCODE = 0
