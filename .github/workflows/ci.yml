name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  test:
    name: Lint, build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NSIS
        uses: RealWhyKnot/workflows/setup-nsis@v1
        with:
          version: '3.12'

      - name: Build installer
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          & ./installer/build.ps1 -Version 0.0.0.0-CI
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed ($LASTEXITCODE)" }

      - name: Installer smoke test
        shell: pwsh
        run: |
          ./.github/scripts/Test-Installer.ps1 -Setup target/installer/OpenVR-TrackDoctor-Setup-0.0.0.0-CI.exe -Version 0.0.0.0-CI

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: trackdoctor-${{ github.sha }}
          path: |
            target/installer/OpenVR-TrackDoctor-Setup-0.0.0.0-CI.exe
            target/installer/OpenVR-TrackDoctor-0.0.0.0-CI.zip
          retention-days: 14
