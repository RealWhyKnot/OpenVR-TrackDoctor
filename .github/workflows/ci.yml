name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Workflow syntax
        uses: RealWhyKnot/workflows/workflow-syntax@v1

      - name: Rust components
        shell: pwsh
        run: |
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw "rustup component add failed ($LASTEXITCODE)" }

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NSIS
        shell: pwsh
        run: |
          $want = 'v3.12'
          $have = ''
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (Test-Path -LiteralPath $exe) { $have = (& $exe /VERSION) }
          if ($have -ne $want) {
            choco install nsis --version 3.12.0 --force -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          & ./installer/build.ps1 -Version 0.0.0.0-CI
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed ($LASTEXITCODE)" }

      - name: Installer smoke test
        shell: pwsh
        run: |
          ./.github/scripts/Test-Installer.ps1 -Setup target/installer/OpenVR-TrackDoctor-Setup-0.0.0.0-CI.exe -Version 0.0.0.0-CI

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: trackdoctor-${{ github.sha }}
          path: |
            target/installer/OpenVR-TrackDoctor-Setup-0.0.0.0-CI.exe
            target/installer/OpenVR-TrackDoctor-0.0.0.0-CI.zip
          retention-days: 14
