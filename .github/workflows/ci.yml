name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install NSIS
        shell: pwsh
        run: |
          $want = 'v3.12'
          $have = ''
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (Test-Path -LiteralPath $exe) { $have = (& $exe /VERSION) }
          if ($have -ne $want) {
            choco install nsis --version 3.12.0 --force -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.0.0-ci

      - name: Install and uninstall
        shell: pwsh
        run: ./.github/scripts/Test-Installer.ps1 -Setup target/installer/TrackDoctor-Setup-0.0.0-ci.exe -Version 0.0.0-ci
